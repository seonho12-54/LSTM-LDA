[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oil-wise-ai"
version = "0.1.0"
description = "Oil-price forecasting with Seeded LDA news signals and a multivariate LSTM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "seonho12-54" }]
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
topic = [
  "gensim>=4.3.3",
  "kiwipiepy>=0.18",
]
lstm = ["torch>=2.2"]
all = [
  "gensim>=4.3.3",
  "kiwipiepy>=0.18",
  "torch>=2.2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
oil-wise = "oil_wise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests requiring optional ML dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
